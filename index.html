<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusCare - College Complaint Management System</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #f0f4f8; color: #333; padding: 15px; }
        .navbar { background: #1e3a8a; color: white; padding: 15px 20px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
        h2, h3 { color: #1e3a8a; margin-bottom: 15px; }
        .form-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 4px; font-weight: 600; font-size: 0.9rem; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.9rem; }
        .btn { background: #2563eb; color: white; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-weight: 600; width: 100%; }
        .btn:hover { background: #1d4ed8; }
        .role-btn { background: #e2e8f0; color: #334155; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: 600; margin-left: 5px; }
        .role-btn.active { background: #3b82f6; color: white; }
        .complaint-item { border-left: 5px solid #3b82f6; background: #f8fafc; padding: 15px; border-radius: 6px; margin-bottom: 12px; }
        .badge { display: inline-block; padding: 3px 8px; border-radius: 12px; font-size: 0.75rem; font-weight: bold; color: white; }
        .badge-submitted { background: #64748b; }
        .badge-progress { background: #eab308; }
        .badge-resolved { background: #22c55e; }
        .badge-closed { background: #0f172a; }
        .priority-high { color: #dc2626; font-weight: bold; }
        .ai-box { background: #eff6ff; border: 1px dashed #3b82f6; padding: 10px; border-radius: 6px; margin-top: 10px; font-size: 0.85rem; }
    </style>
</head>
<body>
    <div class="container">
        <div class="navbar">
            <h2>🎓 CampusCare</h2>
            <div>
                <button class="role-btn active" id="studentTab" onclick="switchView('student')">Student View</button>
                <button class="role-btn" id="adminTab" onclick="switchView('admin')">Admin View</button>
            </div>
        </div>

        <!-- STUDENT DASHBOARD -->
        <div id="studentView">
            <div class="card">
                <h3>Submit New Complaint</h3>
                <form id="complaintForm">
                    <div class="form-group">
                        <label>Student Name / Roll No</label>
                        <input type="text" id="studentName" placeholder="Ex: Rahul - 4NI21CS001" required>
                    </div>
                    <div class="form-group">
                        <label>Category</label>
                        <select id="category">
                            <option>Hostel Facilities</option>
                            <option>Infrastructure & Repairs</option>
                            <option>Academic / Lab Equipment</option>
                            <option>Wi-Fi & Network Issue</option>
                            <option>Cleanliness & Hygiene</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Specific Location</label>
                        <input type="text" id="location" placeholder="Ex: CS Lab 2 / Hostel Block B - Room 104" required>
                    </div>
                    <div class="form-group">
                        <label>Priority Level</label>
                        <select id="priority">
                            <option value="Low">Low</option>
                            <option value="Medium">Medium</option>
                            <option value="High">High (Urgent)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Complaint Description</label>
                        <textarea id="description" rows="3" placeholder="Describe the problem clearly..." required></textarea>
                    </div>
                    <button type="submit" class="btn">Lodge Complaint</button>
                </form>
            </div>

            <div class="card">
                <h3>My Complaint History & Real-Time Tracking</h3>
                <div id="studentComplaintList"></div>
            </div>
        </div>

        <!-- ADMIN DASHBOARD -->
        <div id="adminView" style="display: none;">
            <div class="card">
                <h3>Admin Management & Status Flow Console</h3>
                <p style="font-size: 0.85rem; color: #64748b; margin-bottom: 15px;">
                    Workflow Status: <b>Submitted &rarr; Under Review &rarr; Assigned &rarr; In Progress &rarr; Resolved &rarr; Closed</b>
                </p>
                <div id="adminComplaintList"></div>
            </div>
        </div>
    </div>

    <script>
        // Sample DB Data
        let complaints = [
            { id: 101, name: "Suresh (CS21)", category: "Wi-Fi & Network Issue", location: "Hostel Block A", priority: "High", desc: "No Wi-Fi connectivity on 2nd floor since morning.", status: "In Progress", aiSummary: "Network outage reported at Hostel A." },
            { id: 102, name: "Ananya (EC19)", category: "Infrastructure & Repairs", location: "EC Seminar Hall", priority: "Medium", desc: "Projector lamp flickers during presentation.", status: "Submitted", aiSummary: "Hardware maintenance required for projector." }
        ];

        function renderComplaints() {
            const studentList = document.getElementById('studentComplaintList');
            const adminList = document.getElementById('adminComplaintList');
            studentList.innerHTML = '';
            adminList.innerHTML = '';

            complaints.forEach((item, index) => {
                let badgeClass = 'badge-submitted';
                if(item.status === 'In Progress' || item.status === 'Assigned') badgeClass = 'badge-progress';
                if(item.status === 'Resolved') badgeClass = 'badge-resolved';
                if(item.status === 'Closed') badgeClass = 'badge-closed';

                // Student Render
                studentList.innerHTML += `
                    <div class="complaint-item">
                        <div style="display:flex; justify-content:space-between;">
                            <b>#${item.id} - ${item.category}</b>
                            <span class="badge ${badgeClass}">${item.status}</span>
                        </div>
                        <p style="margin: 5px 0;"><small>📍 Location: ${item.location} | Priority: <span class="priority-high">${item.priority}</span></small></p>
                        <p>${item.desc}</p>
                        <div class="ai-box">🤖 <b>AI Categorization & Summary:</b> ${item.aiSummary}</div>
                    </div>
                `;

                // Admin Render
                adminList.innerHTML += `
                    <div class="complaint-item">
                        <div style="display:flex; justify-content:space-between;">
                            <b>#${item.id} - ${item.name}</b>
                            <span class="badge ${badgeClass}">${item.status}</span>
                        </div>
                        <p><small>Category: ${item.category} | Location: ${item.location}</small></p>
                        <p style="margin: 5px 0;">${item.desc}</p>
                        <div style="margin-top: 10px;">
                            <label style="font-size:0.8rem;">Update Status Flow:</label>
                            <select onchange="updateStatus(${index}, this.value)" style="width:auto; padding:4px;">
                                <option value="Submitted" ${item.status=='Submitted'?'selected':''}>Submitted</option>
                                <option value="Under Review" ${item.status=='Under Review'?'selected':''}>Under Review</option>
                                <option value="Assigned" ${item.status=='Assigned'?'selected':''}>Assigned</option>
                                <option value="In Progress" ${item.status=='In Progress'?'selected':''}>In Progress</option>
                                <option value="Resolved" ${item.status=='Resolved'?'selected':''}>Resolved</option>
                                <option value="Closed" ${item.status=='Closed'?'selected':''}>Closed</option>
                            </select>
                        </div>
                    </div>
                `;
            });
        }

        document.getElementById('complaintForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const name = document.getElementById('studentName').value;
            const category = document.getElementById('category').value;
            const location = document.getElementById('location').value;
            const priority = document.getElementById('priority').value;
            const desc = document.getElementById('description').value;

            const newComplaint = {
                id: Math.floor(100 + Math.random() * 900),
                name: name, category: category, location: location,
                priority: priority, desc: desc, status: "Submitted",
                aiSummary: `AI Auto-Summary: High priority ${category} issue logged at ${location}.`
            };

            complaints.unshift(newComplaint);
            renderComplaints();
            this.reset();
            alert('Complaint registered successfully in CampusCare System!');
        });

        function updateStatus(index, newStatus) {
            complaints[index].status = newStatus;
            renderComplaints();
        }

        function switchView(view) {
            if(view === 'student') {
                document.getElementById('studentView').style.display = 'block';
                document.getElementById('adminView').style.display = 'none';
                document.getElementById('studentTab').classList.add('active');
                document.getElementById('adminTab').classList.remove('active');
            } else {
                document.getElementById('studentView').style.display = 'none';
                document.getElementById('adminView').style.display = 'block';
                document.getElementById('adminTab').classList.add('active');
                document.getElementById('studentTab').classList.remove('active');
            }
        }

        renderComplaints();
    </script>
</body>
  </html>
